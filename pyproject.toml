[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ansys-mcp-server"
description = "Model Context Protocol server for Ansys simulation software"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
keywords = ["ansys", "mcp", "simulation", "cfd", "fea", "engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dynamic = ["version"]

dependencies = [
    "mcp>=1.2",
    "ansys-fluent-core>=0.26",
]

[project.optional-dependencies]
fluent = ["ansys-fluent-core>=0.26"]
mapdl = ["ansys-mapdl-core>=0.65.0"]
geometry = ["ansys-geometry-core>=0.3.0"]
mechanical = ["ansys-mechanical-core>=0.10.0"]
full = [
    "ansys-fluent-core>=0.15.0",
    "ansys-mapdl-core>=0.65.0",
    "ansys-geometry-core>=0.3.0",
    "ansys-mechanical-core>=0.10.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/ansys-mcp-server"
Documentation = "https://github.com/yourusername/ansys-mcp-server/wiki"
Repository = "https://github.com/yourusername/ansys-mcp-server.git"
"Bug Tracker" = "https://github.com/yourusername/ansys-mcp-server/issues"

[project.scripts]
ansys-mcp-server = "ansys_mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ansys_mcp_server*"]

[tool.setuptools.dynamic]
version = {attr = "ansys_mcp_server.__version__"}

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "ansys.*",
    "mcp.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["ansys_mcp_server"]
omit = [
    "*/tests/*",
    "*/examples/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]